<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&family=Montserrat:wght@400;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF4F4; --surface:#FFFFFF; --ink:#3A3A3A; --muted:#66707A; --line:#D7E0E1;
  --court:#069BA6; --ok:#0E9F86; --ok-soft:#DDF4EF; --no:#D9433F; --no-soft:#FBE6E5;
  --u4:#D9433F; --u3:#E8730C; --u2:#E8A317; --u1:#5A6A80;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root{ --bg:#0D1624; --surface:#16233A; --ink:#E8EEF6; --muted:#9AAAC0; --line:#2A3A55; --court:#3CC3CC; --ok:#3CCFB2; --ok-soft:#123A36; --no:#F17672; --no-soft:#3E1F25; --u1:#9AAAC0; color-scheme:dark; } }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer} button:disabled{opacity:.5;cursor:default}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 56px}
.lock{font-size:11.5px;background:#EEF1F5;border-radius:6px;padding:1px 6px;color:#5A6A80}
.andrea-az{display:flex;gap:8px;margin:6px 0 2px;flex-wrap:wrap}.andrea-az button{font:inherit;font-size:12.5px;border:1px solid #D6DEE8;background:var(--card,#fff);color:inherit;border-radius:8px;padding:4px 9px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:8px}
.chi{font-size:13px;color:var(--muted);margin:4px 0 2px}.chi select{font:inherit;font-size:13px;border:1px solid #D6DEE8;border-radius:8px;padding:2px 6px;background:var(--card,#fff);color:inherit}
.newbtn{width:100%;border:1.5px dashed var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:700;margin:0 0 14px}
.newform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
.newform h2{margin:0 0 8px;font-size:20px}
.newform label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
.newform textarea,.newform select,.newform input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.newform textarea{min-height:70px}
.newform .hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.nfbtns{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.hero{background:#3A3A3A;color:#fff;border-radius:0 0 22px 22px;padding:22px 20px 20px;margin:0 -16px 18px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand img{height:36px;width:auto}
.brand span{font-family:"Montserrat",var(--body);font-weight:900;font-size:16px;letter-spacing:.5px;line-height:1}
.brand small{display:block;font-weight:400;font-size:10px;letter-spacing:3px;opacity:.85;margin-bottom:3px}
.brand b{color:#2FC2CC;font-weight:900}
.hero h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0 0 6px}
.hero p{margin:0;opacity:.92;font-size:15px}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;min-width:88px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.stat span{font-size:13px}
.msg{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.no{background:var(--no-soft);color:var(--no)} .msg.gia{background:var(--surface);border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--u1);border-radius:14px;padding:14px;margin-bottom:12px;scroll-margin-top:16px}
.card.u6{border-left-color:#D9433F} .card.u5{border-left-color:#E8730C} .card.u4{border-left-color:#E8A317} .card.u3{border-left-color:#2F6DB5} .card.u2{border-left-color:#7A4DD8}
.card.focus{box-shadow:0 0 0 3px var(--court)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{color:#fff;font-weight:700;border-radius:999px;padding:2px 9px;font-size:12px}
.st{font-weight:700;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.st.lavorazione{background:#DDF2F3;color:#06808A;border-color:transparent} .st.nonrisolta{background:var(--no-soft);color:var(--no);border-color:transparent}
.card h3{margin:6px 0 2px;font-size:17px;line-height:1.3}
.due{font-size:14px;font-weight:700;color:var(--muted)} .due.late{color:var(--no)}
.anote,.dnote{font-size:14px;color:var(--muted);margin:6px 0 0;border-left:3px solid var(--line);padding-left:8px}
.dnote{color:var(--court);border-left-color:var(--court)}
.choose{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.choose button{border:1.5px solid var(--line);background:transparent;border-radius:10px;min-height:46px;font-weight:700;font-size:14px;padding:6px}
.choose button[aria-pressed="true"][data-s="risolta"]{background:var(--ok);border-color:var(--ok);color:#fff}
.choose button[aria-pressed="true"][data-s="lavorazione"]{background:#3A3A3A;border-color:#3A3A3A;color:#fff}
.choose button[aria-pressed="true"][data-s="nonrisolta"]{background:var(--no);border-color:var(--no);color:#fff}
.form{margin-top:10px}
.form label{font-size:14px;font-weight:700}
textarea{width:100%;margin-top:4px;border:1.5px solid var(--court);border-radius:10px;padding:10px;min-height:80px;background:var(--bg);resize:vertical}
.confirm{width:100%;margin-top:8px;border:0;border-radius:11px;min-height:48px;font-weight:700;background:var(--ink);color:var(--bg)}
.empty{background:var(--ok-soft);color:var(--ok);border-radius:18px;padding:26px 20px;text-align:center}
.empty b{display:block;font-family:var(--display);font-size:34px;line-height:1.1}
.linkbtn{border:0;background:none;color:var(--court);font-weight:600;text-decoration:underline;padding:8px 0}
.donecard{opacity:.85;border-left-color:var(--ok)!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.hidden{display:none!important}
</style>
</head>

all>OFFICINE <b>SPORTIVE</b></span></div><h1>Action plan</h1><p>Le cose da sistemare emerse dagli audit, in ordine di urgenza.</p>

<div class="toast hidden" id="toast"></div>
<script>
const unq = s => { s = String(s == null ? "" : s).trim(); return (s.length > 1 && ((s[0] === "'" && s[s.length-1] === "'") || (s[0] === '"' && s[s.length-1] === '"'))) ? s.slice(1,-1) : s; };
/* Jarvis: i dati che prima scriveva Google nella pagina arrivano dall'indirizzo e dall'action plan */
const QP = new URLSearchParams(location.search);
const SRV = { msg: "", focus: (QP.get("id")||"").replace(/[^\w\-]/g,""), stato: ["risolta","lavorazione","nonrisolta"].includes(QP.get("s")) ? QP.get("s") : "",
  vista: QP.get("vista") || "tutto", nuova: QP.get("nuova") === "1" ? "1" : "", affida: QP.get("affida") || "",
  team: sessionStorage.getItem("ap-team") || "", club: "", padel: "", titolare: "" };
const MSG = unq(SRV.msg), FOCUS = unq(SRV.focus), STATO = unq(SRV.stato), VISTA = unq(SRV.vista) || "tutto", NUOVA = unq(SRV.nuova) === "1";
const ruolo = a => a.resp === "padel" ? "padel" : "club";
// Jarvis: nomi dall'Anagrafica (riserva: quelli di oggi)
const CLUB = unq(SRV.club) || "Alessandro", PADEL = unq(SRV.padel) || "Luca", TITOLARE = unq(SRV.titolare) || "Andrea";
const TEAM = unq(SRV.team) ? unq(SRV.team).split("|") : ["Alessandro","Andrea","Luca","Aurora","Francesca","Giorgia","Teresa"];
const chiDi = a => (a.chi && TEAM.includes(a.chi)) ? a.chi : (ruolo(a)==="padel" ? PADEL : CLUB);
const IO = VISTA==="tutto" ? TITOLARE : VISTA==="club" ? CLUB : VISTA==="padel" ? PADEL : VISTA.startsWith("p-") ? VISTA.slice(2) : TITOLARE;
const DIRIGE = VISTA==="tutto" || VISTA==="club";   // solo Andrea e Alessandro inseriscono e affidano le azioni
const puo = a => chiDi(a)===IO;
const vede = a => DIRIGE ? true : chiDi(a)===IO;
const URG = {6:"Giornaliera",5.7:"Pulizia · 2 giorni",5.5:"Insoluti · ogni 2 giorni",5:"Settimanale",4.5:"Manutenzione · 15 giorni",4:"Mensile",3:"Trimestrale",2:"Semestrale",1:"Annuale"};
const COL = {6:"#D9433F",5.7:"#06808A",5.5:"#B42318",5:"#E8730C",4.5:"#C2410C",4:"#E8A317",3:"#2F6DB5",2:"#7A4DD8",1:"#5A6A80"};
const AREE = ["Reception e ufficio","Comunicazione","Cassa e amministrazione","Soci e commerciale","Team","Struttura e sicurezza","Fitness","Piscina","Padel","Altro"];
const GIORNI_U = {6:"oggi",5:"7 giorni",4.5:"15 giorni",4:"30 giorni",3:"90 giorni",2:"180 giorni",1:"365 giorni"};
let showNew = NUOVA;
const AFFIDA = unq(SRV.affida||"");
const STATI = {dafare:"Da fare",lavorazione:"In lavorazione",risolta:"Risolta",nonrisolta:"Non risolta"};
const DOMANDA = {risolta:"Come l’hai risolta? (obbligatorio)", lavorazione:"Cosa stai facendo e a che punto sei? (obbligatorio)", nonrisolta:"Perché non è risolta? (obbligatorio)"};
let plan=[], pending={}, drafts={}, showDone=false, busy=false, focusDone=false;
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"\x26amp;","<":"\x26lt;",">":"\x26gt;",'"':"\x26quot;","'":"\x26#39;"}[c]));
const d = ts => new Date(ts).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
const run = (fn,...a) => fetch("/api/jarvis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fn:"apRun",args:[fn,a]})})
  .then(r=>r.json()).then(r=>{ const x=r&&r.data; if(!r.ok||!x) throw new Error("L’action plan non risponde: riprova tra poco."); if(!x.ok) throw new Error(x.errore||"Errore"); return x.data; });
let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(tt); tt=setTimeout(()=>t.classList.add("hidden"),3400); }
function giorni(a){ const o=new Date(); o.setHours(12,0,0,0); const s=new Date(a.due); s.setHours(12,0,0,0); return Math.round((s-o)/864e5); }
function dueText(a){
  const g=giorni(a);
  if(g<0) return {red:true, t:`Scaduta da ${-g} giorn${g===-1?"o":"i"} (era entro il ${d(a.due)})`};
  if(g===0) return {red:true, t:"Scade oggi"};
  if(g===1) return {red:true, t:`Scade domani (${d(a.due)})`};
  return {red:false, t:`Entro il ${d(a.due)} (${g} giorni)`};
}
function card(a){
  const dt=dueText(a), p=pending[a.id];
  return `<article class="card u${a.u} ${a.id===FOCUS&&!focusDone?"focus":""}" id="c-${esc(a.id)}">
    <div class="top"><span class="badge" style="background:${COL[a.u]}">${esc(URG[a.u])}</span><span>${esc(a.area)}</span><span class="st ${a.status}">${STATI[a.status]}</span></div>
    <h3>${esc(a.t)}</h3>
    <div class="due ${dt.red?"late":""}">${dt.t}</div>
    <div class="chi">${a.bloccata?"🔒":"👤"} Se ne occupa: <b>${esc(chiDi(a))}</b>${a.bloccata?` <span class="lock">bloccata da ${esc(TITOLARE)}</span>`:""}${DIRIGE && a.status!=="risolta" && (!a.bloccata || VISTA==="tutto") ? ` · <select data-assegna="${esc(a.id)}" aria-label="Affida a">${["",...TEAM].map(n=>`<option value="${n}">${n?n:"Affida a…"}</option>`).join("")}</select>` : ""}</div>
    ${VISTA==="tutto" ? `<div class="andrea-az"><button data-blocca="${esc(a.id)}" data-v="${a.bloccata?0:1}">${a.bloccata?"🔓 Sblocca il trasferimento":"🔒 Blocca il trasferimento"}</button><button data-elimina="${esc(a.id)}">🗑️ Elimina</button></div>` : ""}
    ${a.anote?`<p class="anote">${a.origine==="gm"?"🔧 Segnalazione: ":a.origine==="manuale"?"➕ Nuova azione ":a.origine==="insoluti"?"📊 Dal Daily: ":"Dall’audit: "}${esc(a.anote)}</p>`:""}
    ${a.dnote?`<p class="dnote">Ultima nota: ${esc(a.dnote)}</p>`:""}
    ${puo(a) ? `<div class="choose">${["risolta","lavorazione","nonrisolta"].map(s=>`<button data-pick="${esc(a.id)}" data-s="${s}" aria-pressed="${p===s}">${s==="risolta"?"✅ Risolta":s==="lavorazione"?"🔧 In lavorazione":"❌ Non risolta"}</button>`).join("")}</div>` : `<p class="anote">👁️ Solo in visione · se ne occupa ${ruolo(a)==="padel"?"il padel coordinator":"il club coordinator"}</p>`}
    ${p?`<div class="form"><label for="t-${esc(a.id)}">${DOMANDA[p]}</label><textarea id="t-${esc(a.id)}" data-draft="${esc(a.id)}">${esc(drafts[a.id]||"")}</textarea><button class="confirm" data-ok="${esc(a.id)}" ${(drafts[a.id]||"").trim()?"":"disabled"}>Conferma: ${STATI[p]}</button></div>`:""}
  </article>`;
}
function renderNew(){
  const box=document.getElementById("newbox"); if(!box) return;
  if(!DIRIGE){ box.innerHTML=""; return; }
  if(!showNew){ box.innerHTML=`<button class="newbtn" id="open-new">➕ Inserisci una nuova azione</button>`; return; }
  const oggi=new Date().toISOString().slice(0,10);
  box.innerHTML=`<section class="newform">
    <h2>➕ Nuova azione</h2>
    <label for="nf-t">Cosa va fatto *</label><textarea id="nf-t" placeholder="Es. Sostituire la lampadina dello spogliatoio uomini"></textarea>
    <label for="nf-a">Area</label><select id="nf-a">${AREE.map(a=>`<option${a==="Padel"&&VISTA==="padel"?" selected":""}>${a}</option>`).join("")}</select>
    <label for="nf-u">Entro quando (urgenza)</label><select id="nf-u">${[6,5,4.5,4,3,2,1].map(u=>`<option value="${u}"${u===5?" selected":""}>${URG[u]} · ${GIORNI_U[u]}</option>`).join("")}</select>
    <label for="nf-d">Oppure una data precisa (facoltativa)</label><input type="date" id="nf-d" min="${oggi}">
    ${VISTA==="tutto"?`<label class="chk"><input type="checkbox" id="nf-blocca"> 🔒 Solo io posso cambiare chi se ne occupa</label>`:""}
    <label for="nf-chi">Chi se ne occupa</label><select id="nf-chi">${TEAM.map(n=>`<option${n===IO&&VISTA==="tutto"?" selected":n===CLUB&&VISTA==="club"?" selected":""}>${n}</option>`).join("")}</select>
    <label for="nf-n">Nota (facoltativa)</label><textarea id="nf-n" placeholder="Dettagli utili per chi se ne occupa"></textarea>
    <p class="hint">Arriva a chi se ne occupa, con ${esc(TITOLARE)} e ${esc(CLUB)} sempre in copia. Ogni mattina riceve il promemoria finché non è fatta.</p>
    <div class="nfbtns"><button class="confirm" id="save-new">Inserisci l’azione</button><button class="linkbtn" id="close-new">Annulla</button></div>
  </section>`;
}
function render(){
  renderNew();
  const open=plan.filter(a=>a.status!=="risolta" && vede(a)).sort((x,y)=>(puo(y)-puo(x))||(y.u-x.u)||(x.due-y.due));
  const done=plan.filter(a=>a.status==="risolta" && vede(a)).sort((x,y)=>(y.doneAt||0)-(x.doneAt||0));
  document.getElementById("n-open").textContent=open.length;
  document.getElementById("n-soon").textContent=open.filter(a=>giorni(a)>=0&&giorni(a)<=1).length;
  document.getElementById("n-late").textContent=open.filter(a=>giorni(a)<0).length;
  document.getElementById("list").innerHTML = open.length ? open.map(card).join("") : `<div class="empty"><b>Tutto risolto 🎉</b>Non ci sono azioni aperte.</div>`;
  document.getElementById("donebox").innerHTML = done.length ? `<button class="linkbtn" id="toggle">${showDone?"Nascondi":"Mostra"} le azioni risolte (${done.length})</button>
    ${showDone? done.map(a=>`<article class="card donecard"><div class="top"><span class="badge" style="background:var(--ok)">Risolta</span><span>il ${d(a.doneAt)} · ${esc(a.area)}</span></div><h3>${esc(a.t)}</h3>${a.dnote?`<p class="dnote">${esc(a.dnote)}</p>`:""}</article>`).join(""):""}` : "";
}
async function load(){
  try{ plan=JSON.parse(await run("getPlan")); }catch(e){ document.getElementById("list").innerHTML='<p>Connessione assente. Ricarica la pagina.</p>'; return; }
  if(FOCUS){
    const a=plan.find(x=>x.id===FOCUS);
    if(a && a.status!=="risolta"){ if(STATO && puo(a)) pending[FOCUS]=STATO; }
    else if(a){ document.getElementById("msg").innerHTML=`<div class="msg gia">Questa azione è già stata risolta.</div>`; }
  }
  render();
  // arrivato dalla mail con "cambia: Nome": si conferma con un tocco
  if(FOCUS && AFFIDA && DIRIGE){
    const a=plan.find(x=>x.id===FOCUS);
    if(a && a.status!=="risolta" && chiDi(a)!==AFFIDA){
      const m=document.getElementById("msg");
      m.innerHTML=`<div class="msg" style="background:#E6F6F7;color:#0B4F55;border-radius:12px;padding:12px 14px"><b>👤 Affidare «${esc(a.t)}» a ${esc(AFFIDA)}?</b><br><span style="font-size:13px">Ora se ne occupa ${esc(chiDi(a))}. Da adesso mail e promemoria vanno a ${esc(AFFIDA)}, con Andrea e Alessandro in copia.</span>
        <div style="margin-top:10px;display:flex;gap:8px"><button class="confirm" id="affida-si">Sì, affida a ${esc(AFFIDA)}</button><button class="linkbtn" id="affida-no">Annulla</button></div></div>`;
      document.getElementById("affida-no").onclick=()=>{ m.innerHTML=""; };
      document.getElementById("affida-si").onclick=async(ev)=>{ ev.target.disabled=true;
        try{ const x=JSON.parse(await run("assegnaAzione", FOCUS, AFFIDA, VISTA)); plan=plan.map(y=>y.id===x.id?x:y); render(); m.innerHTML=`<div class="msg ok">Fatto ✓ Ora se ne occupa ${esc(AFFIDA)}.</div>`; }
        catch(err){ ev.target.disabled=false; toast(String(err?.message||err).replace(/^Error:\s*/,"")); } };
      m.scrollIntoView({block:"start"});
    } else if(a && chiDi(a)===AFFIDA){ document.getElementById("msg").innerHTML=`<div class="msg ok">Se ne occupa già ${esc(AFFIDA)} ✓</div>`; }
  }
  if(FOCUS && pending[FOCUS]){ const el=document.getElementById("c-"+FOCUS); el?.scrollIntoView({block:"start"}); document.getElementById("t-"+FOCUS)?.focus({preventScroll:true}); }
}
document.addEventListener("click", async e=>{
  const bl=e.target.closest("[data-blocca]"), el=e.target.closest("[data-elimina]");
  if(bl){ bl.disabled=true; try{ const a=JSON.parse(await run("bloccaAzione", bl.dataset.blocca, bl.dataset.v==="1", VISTA)); plan=plan.map(x=>x.id===a.id?a:x); render(); toast(a.bloccata?"🔒 Bloccata: solo tu puoi cambiare chi se ne occupa":"🔓 Sbloccata"); }catch(err){ bl.disabled=false; toast(String(err?.message||err).replace(/^Error:\s*/,"")); } return; }
  if(el){ const a=plan.find(x=>x.id===el.dataset.elimina); if(!a || !confirm(`Eliminare l’azione «${a.t}»? Non si può recuperare.`)) return; el.disabled=true;
    try{ await run("eliminaAzione", a.id, VISTA); plan=plan.filter(x=>x.id!==a.id); render(); toast("🗑️ Azione eliminata"); }catch(err){ el.disabled=false; toast(String(err?.message||err).replace(/^Error:\s*/,"")); } return; }
});
document.addEventListener("change", async e=>{
  const s=e.target.closest("[data-assegna]"); if(!s || !s.value) return;
  const id=s.dataset.assegna, chi=s.value; s.disabled=true;
  try{ const a=JSON.parse(await run("assegnaAzione", id, chi, VISTA)); plan=plan.map(x=>x.id===a.id?a:x); render(); toast(`Affidata a ${chi} ✓ Le arriva la mail, con ${TITOLARE} e ${CLUB} in copia`); }
  catch(err){ s.disabled=false; toast(String(err?.message||err).replace(/^Error:\s*/,"")); }
});
document.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.id==="open-new"){ showNew=true; renderNew(); document.getElementById("nf-t")?.focus(); return; }
  if(b.id==="close-new"){ showNew=false; renderNew(); return; }
  if(b.id==="save-new"){
    const t=document.getElementById("nf-t").value.trim(); if(!t){ toast("Scrivi cosa va fatto 😉"); return; }
    b.disabled=true; b.textContent="Un attimo…";
    try{
      const a=JSON.parse(await run("nuovaAzione", JSON.stringify({t, area:document.getElementById("nf-a").value, u:Number(document.getElementById("nf-u").value), scad:document.getElementById("nf-d").value, n:document.getElementById("nf-n").value, chi:document.getElementById("nf-chi").value, bloccata:!!document.getElementById("nf-blocca")?.checked}), VISTA));
      plan.push(a); showNew=false; render(); toast("Azione inserita ✓ Da ora parte con i promemoria");
      document.getElementById("c-"+a.id)?.scrollIntoView({block:"center"});
    }catch(err){ b.disabled=false; b.textContent="Inserisci l’azione"; toast(String(err?.message||err).replace(/^Error:\s*/,"")); }
    return;
  }
  if(b.dataset.pick){ const id=b.dataset.pick; pending[id] = pending[id]===b.dataset.s ? undefined : b.dataset.s; const y=window.scrollY; render(); window.scrollTo(0,y); document.getElementById("t-"+id)?.focus({preventScroll:true}); }
  else if(b.dataset.ok){
    const id=b.dataset.ok, s=pending[id], note=(drafts[id]||"").trim(); if(!note||busy) return;
    busy=true; b.disabled=true; b.textContent="Salvataggio…";
    try{ const upd=JSON.parse(await run("updateAction", id, s, note)); Object.assign(plan.find(x=>x.id===id), upd); delete pending[id]; delete drafts[id]; focusDone=true;
      toast(s==="risolta" ? "Risolta ✓ Il responsabile è stato avvisato." : "Aggiornata ✓ Il responsabile è stato avvisato."); }
    catch(err){ toast(String(err && err.message || "Non salvato: controlla la connessione e riprova.")); }
    busy=false; render();
  }
  else if(b.id==="toggle"){ showDone=!showDone; render(); }
});
document.addEventListener("input", e=>{
  const t=e.target; if(!t.dataset.draft) return;
  drafts[t.dataset.draft]=t.value;
  const btn=document.querySelector(`[data-ok="${CSS.escape(t.dataset.draft)}"]`); if(btn) btn.disabled=!t.value.trim();
});
function mostraMsg(m){ if(!m) return; const k=m.split(":")[0], t=m.slice(k.length+1).trim(); document.getElementById("msg").innerHTML=`<div class="msg ${k==="OK"?"ok":k==="GIA"?"gia":"no"}">${esc(t)}</div>`; }
mostraMsg(MSG);
/* Jarvis: l'audit manda qui il nuovo action plan (?page=import&d=…) */
if(QP.get("page")==="import"){ run("importa", QP.get("d")||"").then(m=>{ mostraMsg(m); history.replaceState(null,"",location.pathname+"?vista="+encodeURIComponent(VISTA)); load(); }).catch(e=>{ mostraMsg("ERRORE: "+(e&&e.message||e)); load(); }); }
else load();
</script>
</body>
</html>
