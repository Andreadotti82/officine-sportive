<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officine Sportive">
<meta name="robots" content="noindex">
<title>Circolo Officine Sportive</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --petrol:#0B5068; --teal:#129CA6; --mint:#5CC6B4; --grey:#A7A9AC;
  --bg:#F3F8F8; --surface:#FFFFFF; --ink:#10303A; --muted:#5A7078; --line:#D6E6E8; --chip:#E6F5F5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --bg:#071A1F; --surface:#0E2A31; --ink:#E6F2F3; --muted:#93AEB4; --line:#1D4550; --chip:#123A44; --teal:#2FB3BC; }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
header{background:#fff; padding:14px 16px 10px; text-align:center}
header img{width:118px; height:auto; display:block; margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rope{height:8px;background:repeating-linear-gradient(90deg,#0B5068 0 22px,#fff 22px 30px,#129CA6 30px 52px,#fff 52px 60px,#A7A9AC 60px 82px,#fff 82px 90px)}
main{max-width:520px; margin:0 auto; padding:4px 14px 28px}
section{margin-top:20px}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:1.3rem; margin:0 0 10px 2px; display:flex; align-items:center; gap:8px}
h2 .bar{width:5px; height:18px; border-radius:3px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rows{display:flex; flex-direction:column; gap:10px}
.row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:8px 8px 8px 0}
.row > a:first-child{flex:1; display:flex; align-items:center; gap:12px; min-width:0; padding:6px 0 6px 12px; color:inherit; text-decoration:none; border-radius:14px}
.row > a:first-child:active{background:var(--chip)}
.row .name{line-height:1.2}
.row .copy{position:static; flex:none}
.wa{flex:none; display:flex; align-items:center; gap:6px; height:44px; padding:0 14px; border-radius:12px; background:#1FAF5A; color:#fff !important; font-weight:600; font-size:.95rem; text-decoration:none}
.wa:active{filter:brightness(.92)}
.wa svg{width:18px;height:18px}
.tile:last-child:nth-child(odd){grid-column:1 / -1; min-height:84px}
.tile{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:18px; min-height:104px}
.tile a{display:flex; flex-direction:column; justify-content:space-between; gap:12px; height:100%; padding:14px; color:inherit; text-decoration:none; border-radius:18px}
.tile a:active{background:var(--chip); transform:scale(.98)}
.tile a:focus-visible,.copy:focus-visible,.wa:focus-visible{outline:3px solid var(--teal); outline-offset:2px}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;background:var(--chip);flex:none}
.name{font-weight:600; font-size:1rem; line-height:1.2; padding-right:4px}
.copy{position:absolute; top:6px; right:6px; width:40px; height:40px; border:0; border-radius:12px; background:transparent; color:var(--muted); display:grid; place-items:center; cursor:pointer}
.copy svg{width:18px;height:18px}
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); background:#0B5068; color:#fff; padding:10px 16px; border-radius:999px; font-weight:600; font-size:.92rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20}
.toast.show{opacity:1; transform:translate(-50%,0)}
details{margin-top:26px; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); padding-top:14px}
summary{cursor:pointer; color:var(--ink); font-weight:600; padding:6px 0}
details p{margin:6px 0 0; line-height:1.45}
@media (display-mode: standalone){ details{display:none} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} .tile a:active{transform:none} }
</style>
</head>
<body>
<header>
  <h1 class="sr">Circolo Officine Sportive</h1>
  <img src="/logo-os.png" alt="Logo Circolo Officine Sportive">
</header>
<div class="rope" aria-hidden="true"></div>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const J = "https://officine-sportive.vercel.app";
const sections = [
  { title:"Clienti", links:[
    { icon:"✍️", name:"App Contratti", msg:"Ciao! Ecco il link per compilare e firmare il tuo contratto con il Circolo Officine Sportive:", url:J+"/contratti" },
    { icon:"🎁", name:"2 giorni omaggio", msg:"Ciao! Ti regaliamo 2 giorni gratuiti al Circolo Officine Sportive. Attivali da qui:", url:J+"/" },
    { icon:"💪", name:"Fit Check", msg:"Ciao! Prenota qui il tuo Fit Check con i nostri personal trainer al Circolo Officine Sportive:", url:J+"/fitcheck" },
    { icon:"🏊", name:"Prova di nuoto", msg:"Ciao! Ecco il modulo per prenotare la tua prova di nuoto al Circolo Officine Sportive:", url:"https://script.google.com/macros/s/AKfycbwWMxmzDL6DJYHsXQjuKfTnACjptUEmviWkSE3YCYf5Ycc6yTvlPmhiYasS-OxKooctOQ/exec" },
    { icon:"💳", name:"Portale Stripe", msg:"Ciao! Da qui puoi gestire il tuo abbonamento e i pagamenti del Circolo Officine Sportive:", url:"https://billing.stripe.com/p/login/cN2bKJaAM8OM5eoaEE" },
    { icon:"🅿️", name:"Free parking", url:J+"/goodmorning?page=nuovolink&k=__PARK__" }
  ]},
  { title:"Gestione", links:[
    { icon:"🗓️", name:"Turni", url:J+"/turni" },
    { icon:"🌅", name:"Good morning good night", url:J+"/goodmorning" },
    { icon:"✅", name:"Action plan audit", url:J+"/actionplan" },
    { icon:"📝", name:"Homework", url:J+"/hw?k=__HW__" },
    { icon:"🎟️", name:"Lista Guest Pass", url:J+"/lista" },
    { icon:"📋", name:"Audit circolo", url:"https://claude.ai/artifact/ERtyRjveHbKjRHDQ1TZ9g8" },
    { icon:"💶", name:"Prima nota", url:"https://claude.ai/artifact/W4m1TxPSMCugaYrCNEkvkB" },
    { icon:"🧭", name:"Bussola", url:"https://claude.ai/artifact/MzALy3EkBpBYcQcg79NJny" }
  ]},
  { title:"Richieste rapide", links:[
    { icon:"📊", name:"Report Club · apri subito", url:J+"/hw?a=report&k=__HW__" }
  ]},
  { title:"Strumenti", links:[
    { icon:"🔑", name:"Test apertura", url:J+"/goodmorning?prova=__PROVA__" }
  ]}
];
const colors = { "Clienti":"#129CA6", "Gestione":"#0B5068", "Richieste rapide":"#329DA6", "Strumenti":"#5CC6B4" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const sendIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>';
const app = document.getElementById("app");
app.innerHTML = sections.map(s => `
  <section>
    <h2><span class="bar" style="background:${colors[s.title]}"></span>${s.title}</h2>
    ${s.title === "Clienti" ? `<div class="rows">
      ${s.links.map(l => `
        <div class="row">
          <a href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ico" aria-hidden="true">${l.icon}</span><span class="name">${l.name}</span></a>
          <button class="copy" type="button" data-url="${esc(l.url)}" data-name="${esc(l.name)}" aria-label="Copia il link di ${esc(l.name)}">${copyIcon}</button>
          ${l.msg ? `<a class="wa" href="https://wa.me/?text=${encodeURIComponent(l.msg + " " + l.url)}" target="_blank" rel="noopener" aria-label="Invia ${esc(l.name)} su WhatsApp">${sendIcon}Invia</a>` : ""}
        </div>`).join("")}
    </div>` : `<div class="grid">
      ${s.links.map(l => `
        <div class="tile">
          <a href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ico" aria-hidden="true">${l.icon}</span><span class="name">${l.name}</span></a>
          <button class="copy" type="button" data-url="${esc(l.url)}" data-name="${esc(l.name)}" aria-label="Copia il link di ${esc(l.name)}">${copyIcon}</button>
        </div>`).join("")}
    </div>`}
  </section>`).join("") + `
  <details>
    <summary>Come metterla sulla home del telefono</summary>
    <p>iPhone (Safari): tocca Condividi, poi «Aggiungi alla schermata Home».</p>
    <p>Android (Chrome): tocca i tre puntini, poi «Aggiungi a schermata Home».</p>
  </details>`;
const toast = document.getElementById("toast"); let tt;
function showToast(t){ toast.textContent = t; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 1600); }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  try { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch(e){ return false; }
}
app.addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if(!b) return;
  const ok = await copyText(b.dataset.url);
  showToast(ok ? "Link copiato: " + b.dataset.name : "Copia non riuscita, tieni premuto sul riquadro");
});
</script>
</body>
</html>
