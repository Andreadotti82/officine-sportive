<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turni del circolo · Officine Sportive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F5;--surface:#FFFFFF;--surface2:#F3F7F8;--ink:#14323F;--muted:#5A707A;--line:#D4E0E3;
  --brand:#13556F;--brand-ink:#FFFFFF;--teal:#1A9DA7;--teal-soft:#DDF1F2;--brand-soft:#DCE9EE;
  --danger:#B42318;--danger-soft:#FBE3E0;--amber:#8A5A00;--amber-soft:#FAEDD2;--ok:#16765A;--ok-soft:#DBF1E8;--wa:#1E8C4C;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B171C;--surface:#122329;--surface2:#182D34;--ink:#E3EEF1;--muted:#93AAB2;--line:#26404A;
  --brand:#4CB9C4;--brand-ink:#0B171C;--teal:#4CC4C2;--teal-soft:#123A3D;--brand-soft:#173842;
  --danger:#F08A7E;--danger-soft:#3A1F1C;--amber:#E7B65A;--amber-soft:#382C16;--ok:#62CCA4;--ok-soft:#133328;--wa:#48C27A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B171C;--surface:#122329;--surface2:#182D34;--ink:#E3EEF1;--muted:#93AAB2;--line:#26404A;
  --brand:#4CB9C4;--brand-ink:#0B171C;--teal:#4CC4C2;--teal-soft:#123A3D;--brand-soft:#173842;
  --danger:#F08A7E;--danger-soft:#3A1F1C;--amber:#E7B65A;--amber-soft:#382C16;--ok:#62CCA4;--ok-soft:#133328;--wa:#48C27A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,"Helvetica Neue",Arial,system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:96px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:auto;flex:none}
.brand .bt{line-height:1.1;min-width:0}
.brand .bt b{display:block;font-weight:800;font-size:15px;color:var(--brand);letter-spacing:.01em}
.brand .bt span{display:block;font-size:12px;color:var(--teal);font-weight:600}
.who select{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 32px 8px 14px;font-weight:600;font-size:14px;max-width:170px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.month-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.month-row h1{margin:0;font-size:clamp(26px,5.5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-transform:capitalize;color:var(--brand)}
.icon{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.icon:hover{background:var(--surface2)}
main{padding-top:6px}
h2{font-size:19px;margin:24px 0 10px;font-weight:700;color:var(--brand)}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.teal{background:var(--teal);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.wa-btn{background:var(--wa);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.banner{border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner.info{background:var(--teal-soft)}
.banner.warn{background:var(--amber-soft)}
.banner.err{background:var(--danger-soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.pill.err{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.pill.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.ptag{display:inline-flex;align-items:center;gap:6px}
/* my shifts */
.shift-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.shift{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.shift.past{opacity:.55}
.datebox{width:52px;text-align:center;border-radius:10px;background:var(--brand-soft);color:var(--brand);padding:6px 0;line-height:1.1}
.datebox b{display:block;font-size:21px;font-weight:800}
.datebox span{font-size:11.5px;font-weight:600}
.shift .time{font-size:19px;font-weight:800}
.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.weekchip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:124px}
.weekchip.bad{border-color:var(--danger)}
.weekchip b{font-size:18px}
.bar{height:5px;border-radius:5px;background:var(--surface2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
/* board */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:780px}
.board th,.board td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px;vertical-align:middle}
.board thead th{background:var(--brand);color:var(--brand-ink);font-weight:600}
.board thead th .dn{display:block;font-size:11.5px;font-weight:500;text-transform:capitalize;opacity:.85}
.board thead th .dd{font-size:18px;font-weight:800}
.board thead th.today{background:var(--teal)}
.board thead th .fest{display:block;font-size:10px;font-weight:700;opacity:.95}
.board td.today{background:color-mix(in srgb,var(--teal-soft) 60%,transparent)}
.board .name{text-align:left;font-weight:700;white-space:nowrap;padding-left:12px;position:sticky;left:0;background:var(--surface);z-index:1;min-width:126px}
.board thead .name{background:var(--brand)}
.board .name .stripe{display:inline-block;width:4px;height:22px;border-radius:3px;vertical-align:middle;margin-right:8px}
.board tr.me .name{background:var(--surface2)}
.board tbody tr:last-child td,.board tbody tr:last-child th{border-bottom:0}
.cell{display:block;width:100%;border:0;background:transparent;padding:4px 2px;border-radius:8px;min-height:38px}
.cell.edit{cursor:pointer}
.cell.edit:hover{background:var(--surface2)}
.cell .t{display:block;font-weight:700;font-size:14.5px;white-space:nowrap}
.cell .h{display:block;font-size:11.5px;color:var(--muted)}
.cell .off{color:var(--muted);font-size:12.5px}
.un{display:block;font-size:10.5px;color:var(--danger);font-weight:700;margin-top:2px}
.un.f{color:var(--teal)}
.board tr.gap td,.board tr.gap th{background:var(--danger-soft)}
.board tr.gap .name{color:var(--danger)}
.tot{font-weight:700;white-space:nowrap}
.tot.short{color:var(--danger)}.tot.long{color:var(--amber)}.tot.okk{color:var(--ok)}
/* day list (mobile) */
.daylist{display:none;gap:10px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dayc.today{border-color:var(--teal);border-width:2px}
.dayc h4{margin:0;padding:10px 14px;background:var(--brand-soft);color:var(--brand);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.dayc h4 span{font-size:12px;font-weight:700;color:var(--teal);text-transform:none}
.ent{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:14px}
.ent:first-of-type{border-top:0}
button.ent{cursor:pointer}
.ent .tm{font-weight:800}
.ent.gapx{background:var(--danger-soft);color:var(--danger);font-weight:700}
.ent.me{background:var(--surface2)}
.rest{padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.hrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.viewtog{display:none}
@media (max-width:640px){.daylist{display:grid}.boardwrap{display:none}.vt-table .daylist{display:none}.vt-table .boardwrap{display:block}.viewtog{display:inline-flex}}
/* tema stagionale */
.theme-card{position:relative;overflow:hidden;border-radius:16px;padding:14px 16px;margin:8px 0;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.theme-card .emo{font-size:26px;letter-spacing:4px;line-height:1.2}
.theme-card b{display:block;font-size:16px;margin-top:6px}
.theme-natale{background:linear-gradient(135deg,#B3202A,#1F6B45)}
.theme-pasqua{background:linear-gradient(135deg,#F6B3C9,#A9D8B8);color:#3B2433}
.theme-estate{background:linear-gradient(135deg,#1E9BD7,#F3C969);color:#0F2D3A}
.theme-italia{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding-top:20px}
.theme-italia::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#1E8C4C 33.3%,#F4F4F4 33.3% 66.6%,#C8323C 66.6%)}
.theme-lavoro{background:linear-gradient(135deg,#C8323C,#F08A5D)}
.theme-roma{background:linear-gradient(135deg,#8E3B2C,#E3A74F)}
.theme-autunno{background:linear-gradient(135deg,#8A4B1F,#D98B3A)}
.badge-emo{font-size:15px;margin-left:4px}
#snow{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#snow i{position:absolute;top:-24px;color:#fff;text-shadow:0 0 3px rgba(20,50,63,.35);font-style:normal;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){#snow{display:none}}
#lights{display:flex;justify-content:space-between;gap:4px;padding:0 4px;margin:2px 0 0;height:14px}
#lights i{width:9px;height:9px;border-radius:50%;display:block;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.8)}}
.fw{position:absolute;font-size:28px;animation:burst 2.4s ease-out infinite;opacity:0}
@keyframes burst{0%{transform:scale(.2);opacity:0}20%{opacity:1}80%{transform:scale(1.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
#snow i.conf{width:8px;height:12px;border-radius:2px;color:transparent;text-shadow:none}
.theme-card .count{font-size:30px;font-weight:800;line-height:1.1;margin-top:6px}
.theme-befana{background:linear-gradient(135deg,#3B2A6B,#B5651D)}
.theme-anno{background:linear-gradient(135deg,#14323F,#6B4BB8)}
@media (prefers-reduced-motion:reduce){#lights i,.fw{animation:none;opacity:1}}
/* riunioni ed eventi nella griglia */
.evchip{display:block;font-size:11px;font-weight:700;color:var(--brand);background:var(--teal-soft);border-radius:6px;padding:2px 5px;margin-bottom:3px;white-space:nowrap}
.evbox{margin:8px 10px;padding:10px 12px;border-radius:12px;background:var(--teal-soft);border:1px solid var(--teal)}
.evhead{display:flex;justify-content:space-between;gap:8px;color:var(--brand)}
.evppl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.evp{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;background:var(--surface);border-radius:999px;padding:3px 9px;border:1px solid var(--line)}
.evp i{width:8px;height:8px;border-radius:50%;display:block}
.evp.no{opacity:.55;text-decoration:line-through}
/* availability */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{text-align:center;font-size:12.5px;color:var(--muted);text-transform:capitalize;font-weight:600}
.day{aspect-ratio:1/1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:16px}
.day small{font-size:10px;font-weight:700;line-height:1}
.day.all{background:var(--danger);color:#fff;border-color:transparent}
.day.ferie{background:var(--teal);color:#fff;border-color:transparent}
.day.am{background:linear-gradient(180deg,var(--amber-soft) 0 50%,var(--surface) 50%);border-color:var(--amber)}
.day.pm{background:linear-gradient(180deg,var(--surface) 0 50%,var(--amber-soft) 50%);border-color:var(--amber)}
.day.past{opacity:.45}
.day.fest{box-shadow:inset 0 -3px 0 var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);display:inline-block}
/* swaps */
.swap{display:grid;gap:8px}
.swap-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.swap .what{font-size:17px;font-weight:800}
.note{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:13.5px}
/* gestione */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:12px}
.step.on{background:var(--brand);color:var(--brand-ink)}
.step.on b{background:var(--brand-ink);color:var(--brand)}
.step.done{color:var(--ok)}
.step.done b{background:var(--ok);color:#fff}
.field{display:grid;gap:4px;font-size:13px;font-weight:600}
.inp,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:500;font-size:14px;width:100%}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.staff-row{display:grid;grid-template-columns:40px 1fr 78px;gap:8px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.staff-row .email{grid-column:2/3}
.staff-row .rm{grid-column:3/4}
.staff-row input[type=color]{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface)}
.list{list-style:none;margin:0;padding:0}
.lzdots{display:flex;gap:5px;flex-wrap:wrap}.lzdots i{width:14px;height:14px;border-radius:50%;background:var(--teal)}.lzdots i.u{background:var(--line)}
.lzcard{margin-bottom:10px}.sigwrap{position:relative;border:2px dashed var(--teal);border-radius:16px;background:var(--surface2);margin:8px 0}
.sigwrap canvas{display:block;width:100%;height:auto;aspect-ratio:600/240;touch-action:none;cursor:crosshair}
.sigwrap span{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:var(--muted);font-size:13px;pointer-events:none}
.lzcheck{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:34px;display:flex;align-items:center;justify-content:center;margin:6px auto}

.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.wa{background:var(--surface2);border-radius:12px;padding:12px}
.wa-text{white-space:pre-wrap;font-size:13.5px;margin-bottom:10px}
.plan{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:0}
details summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"+";font-size:22px;color:var(--muted)}
details[open] summary::after{content:"–"}
details summary::-webkit-details-marker{display:none}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.pick button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;text-align:left}
.pick button:hover{background:var(--surface2)}
.opt{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:14px}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--brand)}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:1040px;margin:0 auto;display:flex}
.tabs button{flex:1;min-width:0;white-space:nowrap;border:0;background:transparent;padding:10px 2px 12px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
dialog{border:0;border-radius:18px;padding:0;max-width:min(470px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(6,20,26,.55)}
.dlg{padding:18px}
.dlg h3{font-size:18px;margin-bottom:10px;color:var(--brand)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (min-width:720px){.tabs button{flex-direction:row;font-size:14px;gap:8px;padding:14px 4px}.badge{position:static}.staff-row{grid-template-columns:40px 1.2fr 78px 1.6fr auto}.staff-row .email,.staff-row .rm{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">

function viewBoard(){

  const today=todayYmd(),wst=weeksOfMonth(mk).filter(w=>mk!==mkOf(new Date())||ymd(addDays(fromYmd(w),6))>=today).map(w=>Object.assign({w},weekStatus(me,w)));
  const chips=wst.map(x=>{const pct=x.tg?Math.min(100,x.h/x.tg*100):0;return `<div class="weekchip"><div class="muted small">Sett. ${shortDay(x.w)}</div><b>${fmtH(x.h)}h</b>${me.target?` <span class="muted small">su ${fmtH(x.tg)}</span><div class="bar"><i style="width:${pct}%"></i></div>`:''}${false&&x.short?`<div class="small" style="color:var(--danger);font-weight:700;margin-top:4px">Mancano ${fmtH(x.tg-x.h)}h</div>`:(!x.full&&me.target?'<div class="small muted" style="margin-top:4px">a cavallo del mese</div>':'')}</div>`}).join('');
  const rows=[];

    const d=fromYmd(date),past=date<today,sw=activeSwapFor(date,me.id,sh.a,sh.b),f=festivo(date);

    if(sw)act=`<span class="pill ${sw[1].status==='presa'?'brand':'amber'}">${sw[1].status==='presa'?'Preso da '+esc(nameOf(sw[1].takenBy)):'Cambio richiesto'}</span>`;

    rows.push(`<li class="shift ${past?'past':''}"><div class="datebox"><b>${d.getDate()}</b><span>${GG[dow(d)]}</span></div><div><div class="time">${fmtS(sh)}</div><div class="muted small">${fmtH(sh.b-sh.a)} ore${f?', '+esc(f):''}</div></div><div>${act}</div></li>`)}
  return `<h2>Ciao ${esc(me.name)}${me.id===cfg.coordinatorId?' <span class="pill brand" style="vertical-align:middle">Club coordinator</span>':''}</h2>${calBtn()}<div style="margin:-4px 0 10px">${ferieLine(me.id,new Date().getFullYear())}</div><div class="weeks">${chips}</div>
  ${false&&wst.some(x=>x.short)?`<div class="banner err" style="margin-top:12px"><span>In almeno una settimana hai meno ore del previsto: segnalalo al club coordinator.</span></div>`:''}
  <h2>${mk===mkOf(new Date())?'I tuoi prossimi turni di ':'I tuoi turni di '}${esc(monthName(mk))}</h2>
  ${rows.length?`<ul class="shift-list">${rows.join('')}</ul>`:`<div class="card empty"><b>Nessun turno questo mese</b>Se pensi sia un errore, scrivi al club coordinator.</div>`}<div class="row" style="justify-content:center;margin-top:18px"><button class="btn ghost small" data-action="pin-change">Cambia il mio PIN</button></div>`;
}

function swapExtra(s){let h='';if(s.back)h+=`<div class="small" style="width:100%">In cambio ${esc(nameOf(s.takenBy))} dà a ${esc(nameOf(s.from))} il turno di ${esc(dayLabel(s.back.date))}, ${fmtS(s.back)}.</div>`;
  const w=ymd(mondayOf(fromYmd(s.date))),len=s.b-s.a,bl=s.back?s.back.b-s.back.a:0,res=[];
  for(const [id,delta] of [[s.from,bl-len],[s.takenBy,len-bl]]){const p=staffById(id);if(!p||!p.target)continue;const ws=weekStatus(p,w);if(!ws.full)continue;res.push({p,after:ws.h+delta,tg:ws.tg})}
  const bad=res.filter(r=>Math.abs(r.after-r.tg)>0.01);
  if(res.length&&canManage())h+=`<div style="width:100%"><span class="pill ${bad.length?'err':'ok'}">${bad.length?'Dopo il cambio: '+esc(res.map(r=>r.p.name+' '+fmtH(r.after)+'h').join(', ')):'Ore a posto per entrambi'}</span></div>`;
  if(s.takenBy&&!isCertified(s.takenBy))h+=`<div style="width:100%"><span class="pill ${isAuthorized(s.takenBy,s.date)?'ok':'err'}">${esc(nameOf(s.takenBy))} non ha gli attestati: ${isAuthorized(s.takenBy,s.date)?'autorizzato dal CEO':'serve l’autorizzazione del CEO'}</span></div>`;
  return h}
function swapMsg(s){const l=link('cambi');return `🔄 Ciao a tutti! ${nameOf(s.from)} avrebbe bisogno di una mano: cerca qualcuno che prenda il suo turno di ${dayLabel(s.date)}, ${fmtS(s)}.${s.note?'\n💬 '+s.note:''}\n${s.to?nameOf(s.to)+', te la senti di prenderlo tu? Sarebbe fantastico 🙏':'Chi riesce a coprirlo? Grazie mille in anticipo 🙏'}${l?'\n👉 Lo prendi da qui: '+l:''}`}
function viewSwaps(){
  const me=ui.me,today=todayYmd(),all=Object.entries(swaps).sort((a,b)=>(a[1].date||'').localeCompare(b[1].date||''));
  const open=all.filter(([,s])=>(s.status==='aperta'||s.status==='presa')&&s.date>=today);
  const hist=all.filter(([,s])=>!(s.status==='aperta'||s.status==='presa')||s.date<today).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0)).slice(0,12);
  const card=([id,s],active)=>{let actions=[],status='';
    if(s.status==='aperta'){status=`<span class="pill amber">Cerca sostituto</span>`;
      if(me!==s.from&&(!s.to||s.to===me))actions.push(`<button class="btn small" data-action="take" data-id="${id}">Prendo io</button>`);
      if(me===s.from||isCoordPerson())actions.push(`<button class="btn ghost small" data-action="cancel-swap" data-id="${id}">Annulla richiesta</button>`);
      actions.push(`<a class="btn wa-btn small" href="${waHref(swapMsg(s))}" target="_blank" rel="noopener">Condividi su WhatsApp</a>`)}
    else if(s.status==='presa'){const ap=approversFor(s);
      status=`<span class="pill brand">Preso da ${esc(nameOf(s.takenBy))}, da approvare da ${esc(ap.list.map(nameOf).join(' o '))}</span>`+swapExtra(s)+(ap.next?`<div class="small muted" style="width:100%">Se nessuno risponde, ${esc(fmtClock(ap.nextAt))} passa a ${esc(nameOf(ap.next))}.</div>`:'');
      const na=!isAuthorized(s.takenBy,s.date);

      if(na&&!ownerView()&&(me===s.takenBy||me===s.from||isCoordPerson()))actions.push(`<a class="btn teal small" href="${esc(safetyMail(s.takenBy,[{date:s.date,a:s.a,b:s.b}]))}" target="_blank" rel="noopener">Chiedi autorizzazione via email</a>`);
      if(canApproveSwap(s))actions.push(`<button class="btn small" data-action="approve" data-id="${id}" ${na?'disabled':''}>Approva</button><button class="btn ghost small" data-action="reject" data-id="${id}">Rifiuta</button>`);
      if(ap.current&&ap.current!==me&&(me===s.takenBy||me===s.from||isCoordPerson())){const l=link('cambi');const msg=`👋 Ciao ${nameOf(ap.current)}! Quando hai un attimo, c’è un cambio turno che aspetta il tuo ok: ${dayLabel(s.date)}, ${fmtS(s)}, da ${nameOf(s.from)} a ${nameOf(s.takenBy)}. Grazie mille! 😊${l?'\n👉 '+l:''}`;actions.push(`<a class="btn wa-btn small" href="${waHref(msg)}" target="_blank" rel="noopener">Avvisa ${esc(nameOf(ap.current))} su WhatsApp</a>`)}
      if(me===s.takenBy||me===s.from)actions.push(`<button class="btn ghost small" data-action="cancel-swap" data-id="${id}">Annulla</button>`)}
    else{status=`<span class="pill ${s.status==='approvata'?'ok':'err'}">${s.status==='approvata'?'Approvato'+(s.approvedBy?' da '+esc(nameOf(s.approvedBy)):'')+': ora è di '+esc(nameOf(s.takenBy)):s.status==='rifiutata'?'Rifiutato':'Annullato'}</span>`+(s.status==='approvata'&&s.back?`<div class="small" style="width:100%">In cambio ${esc(nameOf(s.takenBy))} ha dato a ${esc(nameOf(s.from))} il turno di ${esc(dayLabel(s.back.date))}, ${fmtS(s.back)}.</div>`:'');
}
    return `<div class="card swap"><div class="swap-head"><div><div class="what">${esc(dayLabel(s.date))}, ${fmtS(s)}</div><div class="small muted" style="margin-top:2px">${personTag(s.from)} ${s.to?'chiede a '+esc(nameOf(s.to)):'chiede a chiunque'}</div></div></div><div class="row">${status}</div>${s.note?`<div class="note">${esc(s.note)}</div>`:''}${actions.length&&active?`<div class="row">${actions.join('')}</div>`:''}</div>`};
  return `<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-action="new-swap">Chiedi un cambio</button></div><h2>Richieste aperte</h2>${open.length?`<div class="stack">${open.map(x=>card(x,true)).join('')}</div>`:`<div class="card empty"><b>Nessuna richiesta aperta</b>Per chiedere un cambio vai su I miei e tocca Chiedi cambio sul turno.</div>`}
  ${hist.length?`<h2>Storico</h2><div class="stack">${hist.map(x=>card(x,false)).join('')}</div>`:''}`;
}

  if(pl.type==='natale')body=`Festivi di Natale di ${nameOf(sid)}:\n${pl.days.map(d=>'- '+dayLabel(d)+': '+((r.pref||{})[d]==='si'?'lavoro':(r.pref||{})[d]==='no'?'non lavoro':'indifferente')).join('\n')}`;

function planSummary(pl,P,sid){const me=ui.me;
  if(pl.type==='natale')return `<ul class="list">${pl.days.map(d=>{const a=(P.assign||{})[d]||{};const nm=id=>id?(id===me?'<b>'+esc(nameOf(id))+' (tu)</b>':esc(nameOf(id))):'<span class="muted">da definire</span>';return `<li><span><b>${esc(dayLabel(d))}</b><br><span class="small muted">${esc(festivo(d))}</span></span><span class="small" style="text-align:right">Mattina: ${nm(a.am)}<br>Sera: ${nm(a.pm)}</span></li>`}).join('')}</ul>`;

function planBoardCards(){return staffPlans().filter(pl=>planPub(pl.id)).map(pl=>{const P=planPub(pl.id);
  return `<details class="card" style="margin:10px 0" ${ui.openPlan===pl.id?'open':''}><summary data-action="toggle-plan" data-pid="${pl.id}">${pl.type==='natale'?'🎄 Festivi di Natale: chi lavora':'☀️ Ferie approvate'}</summary><div style="margin-top:10px">${planSummary(pl,P,ui.me)}</div></details>`}).join('')}
function fairNatAssign(pl){const core=cfg.staff.filter(p=>p.target>0),cnt={},am={},out={},issues=[];
  const pref=(id,d)=>{const r=respOf(pl.id,id);return r&&r.pref&&r.pref[d]||''};const avail=d=>core.filter(p=>pref(p.id,d)!=='no'&&unvOf(p.id,d)!=='ferie');
  const order=pl.days.slice().sort((a,b)=>avail(a).length-avail(b).length);
  for(const d of order){const av=avail(d);const score=p=>(cnt[p.id]||0)*10+(sameHolidayLastYear(p.id,d)?6:0)-(pref(p.id,d)==='si'?1:0)+(((p.id.charCodeAt(0)*7+(+d.slice(8))*13)%10)/40);
    const pick=av.sort((a,b)=>score(a)-score(b)).slice(0,2);for(const p of pick)cnt[p.id]=(cnt[p.id]||0)+1;
    pick.sort((a,b)=>(am[a.id]||0)-(am[b.id]||0));if(pick[0])am[pick[0].id]=(am[pick[0].id]||0)+1;
    out[d]={am:pick[0]?pick[0].id:'',pm:pick[1]?pick[1].id:''};
    if(pick.length<2)issues.push(`${dayLabel(d)}: ${av.length?'è disponibile solo '+av.map(p=>p.name).join(', '):'non è disponibile nessuno'}, manca${pick.length?' 1 persona':'no 2 persone'}.`)}
  const vals=core.map(p=>cnt[p.id]||0),mx=Math.max(...vals),mn=Math.min(...vals);
  if(mx-mn>1)issues.push(`Non riesco a dividere i festivi in modo equo: ${core.map(p=>p.name+' '+(cnt[p.id]||0)).join(', ')}. Troppi “preferisco di no” sugli stessi giorni.`);
  return{assign:out,cnt,issues}}
function streaksIn(mk){const out=[],m=months[mk];if(!m||!m.schedule)return out;const days=daysOfMonth(mk);
  for(const p of cfg.staff.filter(p=>p.target>0)){let run=[];const flush=()=>{if(run.length>5&&run[run.length-1]>=todayYmd())out.push(`📆 ${p.name} lavora ${run.length} giorni di fila, dal ${shortDay(run[0])} al ${shortDay(run[run.length-1])}, senza riposo.`);run=[]};
    for(const d of days){if((m.schedule[d]||[]).some(x=>x.s===p.id))run.push(d);else flush()}flush()}return out}
const forzKey=(mk,t)=>{let h=0;for(const c of mk+'|'+t)h=(h*31+c.charCodeAt(0))|0;return 'f'+mk.replace('-','')+'_'+(h>>>0).toString(36)};
const mustFix=t=>t.startsWith('🕐')||t.startsWith('🔴')||(t.startsWith('🎄')&&/manca|nessuno/.test(t));
function fewDaysData(mk){const out=[],m=months[mk];if(!m||!m.schedule)return out;
  for(const w of weeksOfMonth(mk)){const ds=weekDays(w);if(ds[6]<todayYmd())continue;if(!ds.every(d=>{const mm=months[d.slice(0,7)];return mm&&mm.schedule}))continue;
    for(const p of cfg.staff.filter(p=>p.target>0)){const fe=ds.filter(d=>['ferie','all'].includes(unvOf(p.id,d))).length,exp=Math.min(5,Math.max(0,7-fe-2));if(!exp)continue;
      const n=ds.filter(d=>(months[d.slice(0,7)].schedule[d]||[]).some(x=>x.s===p.id)).length;
      if(n<exp)out.push({p,w,n,fe,ds})}}
  return out}
/* "meno di 5 giorni a settimana": segnalata solo se l'impostazione è attiva; altrimenti viene solo registrata in silenzio */
function fewDaysIn(mk){if(!cfg.flag5su7)return[];return fewDaysData(mk).map(x=>`📅 ${x.p.name} lavora solo ${x.n} ${x.n===1?'giorno':'giorni'} nella settimana ${weekRange(x.w)}: la base è 5 giorni su 7${x.fe?' (tolti i giorni di assenza)':''}.`)}

function intoppiAll(mk){return intoppiRaw(mk).concat(streaksIn(mk),fewDaysIn(mk)).map(t=>({t,k:forzKey(mk,t),fix:mustFix(t)}))}
const intoppi=mk=>intoppiAll(mk).filter(x=>x.fix||!forz[x.k]).map(x=>x.t);
function intoppiRaw(mk){const out=[],core=cfg.staff.filter(p=>p.target>0),t=todayYmd();
  for(const pl of upcomingPlans()){if(t<pl.from||planPub(pl.id))continue;
    if(pl.type==='natale')for(const x of fairNatAssign(pl).issues)out.push('🎄 Festivi di Natale: '+x);
    else for(const w of pl.weeks){const who=core.filter(p=>((respOf(pl.id,p.id)||{}).weeks||[]).includes(w));if(who.length>1)out.push(`☀️ Ferie: nella settimana ${weekRange(w)} vorrebbero andare insieme ${who.map(p=>p.name).join(' e ')}. Con ${who.length} persone fuori restano scoperte molte ore: va trovato un accordo.`)}}
  for(const d of redDaysOf(mk)){if(natAssign(d)||d<todayYmd())continue;const av=core.filter(p=>!['all','ferie'].includes(unvOf(p.id,d)));if(av.length<2)out.push(`🔴 ${dayLabel(d)} (${festivo(d)}): ${av.length?'è disponibile solo '+av.map(p=>p.name).join(', '):'non è disponibile nessuno'}, ne servono 2.`)}
  const m=months[mk];if(m&&m.schedule&&m.generatedAt){const g=daysOfMonth(mk).filter(d=>d>=todayYmd()).reduce((t,d)=>t+gapH(gapsOn(d)),0);if(g>0)out.push(`🕐 ${monthName(mk).replace(/^./,c=>c.toUpperCase())}: dopo la generazione restano ${fmtH(g)} ore scoperte, perché tra indisponibilità, ferie e festivi non c’è abbastanza personale in alcuni giorni.`)}
  return out}
function suggestNat(pl){return fairNatAssign(pl).assign}
const redDaysOf=mk=>{const m=+mk.slice(5,7);if(m===12||m===1)return[];return daysOfMonth(mk).filter(isRed)};
function redCard(mk,sid){const rd=redDaysOf(mk);if(!rd.length)return'';const others=cfg.staff.filter(p=>p.target>0&&p.id!==sid);

function planCards(sid){return staffPlans().map(pl=>{const P=planPub(pl.id);if(!P&&!canManage()&&todayYmd()>pl.dl)return `<h2>${esc(pl.title)}</h2><div class="card"><p class="small">Le risposte si sono chiuse ${esc(dayLabel(pl.dl))}: grazie! 🙏 Ora il piano lo prepara ${esc(nameOf(cfg.coordinatorId))} e lo trovi nei turni appena è pronto.</p></div>`;if(P)return `<h2>${esc(pl.title)}</h2><div class="card stack"><span class="pill ok">Approvato e pubblicato</span>${planSummary(pl,P,sid)}</div>`;const r=respOf(pl.id,sid)||{},others=cfg.staff.filter(p=>p.target>0&&p.id!==sid);let body='';

function hwDati(mk){
  const m=months[mk]; const out={m:mk,s:{},f:{}};
  if(m&&m.status==='pubblicato'&&m.schedule){
    for(const day of Object.keys(m.schedule).sort()){ const sh=(m.schedule[day]||[]).filter(x=>x&&x.s); if(sh.length) out.s[day.slice(8,10)]=sh.map(x=>[x.s,x.a,x.b]); }
  }
  try{ const pid='ferie-'+mk.slice(0,4);
    for(const st of (cfg.staff||[])){ if(!st.id) continue; const giorni=[];
      for(const w of (ferieWeeksOf(pid,st.id)||[])){ let d=fromYmd(w); for(let i=0;i<7;i++){ const y=ymd(d); if(y.slice(0,7)===mk) giorni.push(y.slice(8,10)); d=addDays(d,1); } }
      if(giorni.length) out.f[st.id]=giorni; } }catch(e){}
  return out;
}
function hwUrl(mk){
  const json=JSON.stringify(hwDati(mk));
  const b64=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return HW_URL+'?a=turni&k='+HW_KEY+'&d='+b64;
}

function hwSegna(mk){ const m=months[mk]; lsSet('hw2.sent.'+mk,String((m&&m.updatedAt)||'')); }
function hwDaMandare(){
  if(!canManage()) return [];
  const t=new Date();
  return [0,1].map(k=>{const d=new Date(t.getFullYear(),t.getMonth()+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})
    .filter(mk=>{const m=months[mk];return m&&m.status==='pubblicato'&&m.schedule&&lsGet('hw2.sent.'+mk)!==String(m.updatedAt||'')});
}
document.addEventListener('click',()=>{
  let L=[]; try{ L=hwDaMandare(); }catch(e){ return; }
  if(!L.length) return;
  const mk=L[0];
  try{ const w=window.open(hwUrl(mk),'hw-auto'); if(w){ hwSegna(mk); setTimeout(()=>{ try{ w.close(); }catch(e){} },6000); } }catch(e){}
},true);
function gmInvia(gm){
  const mesi=[...gmCambiati]; gmCambiati.clear();
  if(!mesi.length){ try{ gm.w&&gm.w.close(); }catch(e){} return; }
  const mk=mesi.sort().pop();
  let w=gm.w;
  try{ if(w&&!w.closed) w.location.href=gmUrl(mk); else w=window.open(gmUrl(mk),'gm-turni'); }catch(e){ w=null; }
  if(!w){ toast('Turni salvati. Per aggiornarli anche nel Good Morning consenti le finestre pop-up e riprova.'); return; }
  setTimeout(()=>{ try{ w.location.href=hwUrl(mk); hwSegna(mk); }catch(e){} toast('✓ Turni aggiornati anche nel Good Morning'); setTimeout(()=>{ try{ w.close(); }catch(e){} toast('✓ Turni inviati anche a Homework'); }, 6000); }, 5000);
  for(const altro of mesi){ setTimeout(()=>{ try{ const w2=window.open(gmUrl(altro),'gm-turni2'); setTimeout(()=>{ try{ w2.location.href=hwUrl(altro); }catch(e){} setTimeout(()=>{ try{ w2&&w2.close(); }catch(e){} },6000); },5000); }catch(e){} }, 12000); }
}

const lezIsTest=pk=>!!(pk.test||(pk.names||[]).every(n=>/^test\b/i.test(n)));

const lezLeft=pk=>pk.n<0?Infinity:Math.max(0,pk.n-lezUsed(pk._id));
const lezExpired=pk=>!!pk.exp&&pk.exp<todayYmd();
const lezPkgs=tr=>Object.entries(ptpk).map(([k,v])=>Object.assign({_id:k},v)).filter(p=>!tr||p.tr===tr).sort((a,b)=>(lezIsTest(a)-lezIsTest(b))||(a.names[0]||'').localeCompare(b.names[0]||''));
const EMRX=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

const fmtE=v=>(Math.round(v*100)/100).toLocaleString('it-IT',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €';
function sigSvg(str,w,h){if(!str)return '';const paths=str.split('|').map(s=>'M'+s.trim().replace(/,/g,' L')).join(' ');return `<svg viewBox="0 0 300 120" width="${w||90}" height="${h||36}" style="background:var(--surface2);border-radius:6px"><path d="${paths}" style="fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/></svg>`}
function lezDots(pk){if(pk.n<0)return '<span class="pill ok">Illimitate</span>';const u=lezUsed(pk._id),n=pk.n;return `<span class="lzdots">${Array.from({length:n},(_,i)=>`<i class="${i<n-u?'':'u'}"></i>`).join('')}</span>`}
function lezCard(pk){const left=lezLeft(pk),exp=lezExpired(pk),t=lezIsTest(pk),soon=pk.exp&&!exp&&daysTo(todayYmd(),pk.exp)<=30,renew=!exp&&pk.n>0&&pk.kind!=='partita'&&(left<=1||soon);

  <div class="row" style="margin-top:10px;gap:6px"><button class="btn teal" style="flex:1" data-action="lz-start" data-id="${esc(pk._id)}" ${exp||left===0?'disabled':''}>Inizia lezione</button>${ownerView()?`<button class="btn ghost small" data-action="lz-del" data-id="${esc(pk._id)}">Elimina</button>`:''}</div></div>`}

function lezMonthSes(mk){return Object.entries(ptses).map(([k,v])=>Object.assign({_id:k},v)).filter(s=>s.date&&s.date.slice(0,7)===mk).sort((a,b)=>a.at-b.at)}
function lezControl(){const mk=mkOf(new Date()),ses=lezMonthSes(mk);
  let h=`<h2>Controllo lezioni · ${esc(monthLabel(mk))}</h2><p class="small muted" style="margin-top:-6px">Visibile solo a te. Si pagano solo le lezioni firmate.</p>`;

  for(const tr of LEZ_TRAINERS){const real=ses.filter(s=>s.tr===tr&&!s.test&&!s.void);
    for(let i=0;i<real.length;i++){const w=real.filter(s=>s.grp!==real[i].grp&&Math.abs(s.at-real[i].at)<15*60e3&&s.at>=real[i].at);if(w.length>=2){warn.push(`${nameOf(tr)}: ${w.length+1} lezioni firmate a pochi minuti di distanza il ${shortDay(real[i].date)}`);break}}}

  for(const tr of LEZ_TRAINERS){const mine=ses.filter(s=>s.tr===tr&&!s.void),blk=s=>(ptpk[s.pk]||{}).verify==='non trovato',real=mine.filter(s=>!s.test&&!blk(s)),tot=real.reduce((t,s)=>t+(s.pay||0),0);
    h+=`<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${esc(nameOf(tr))}</b><span class="pill ${real.length?'ok':''}">${real.length} firmate · ${fmtE(tot)}</span></div>

  return h}

function lezSigDlg(title,sub,onOk){openDlg(`<h3 style="text-align:center;margin-bottom:4px">${title}</h3><p style="text-align:center;margin:0 0 6px">${sub}</p>
  <div class="sigwrap"><canvas id="sigC" width="600" height="240"></canvas><span id="sigHint">Firma qui col dito</span></div><p id="sigErr" class="small" style="color:var(--danger);text-align:center;min-height:18px;margin:4px 0"></p>
  <div class="actions"><button class="btn ghost" data-action="lz-sig-clear">Cancella</button><button class="btn teal" data-action="lz-sig-ok">Conferma</button></div><div style="text-align:center;margin-top:6px"><button class="btn ghost small" data-action="dlg-cancel">Annulla lezione</button></div>`);
  const c=document.getElementById('sigC'),x=c.getContext('2d');x.lineWidth=5;x.lineCap='round';x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;
  const st={strokes:[],cur:null,onOk};lezSig=st;
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*240/r.height]};
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);st.cur=[pos(e)];st.strokes.push(st.cur);document.getElementById('sigHint').style.display='none';document.getElementById('sigErr').textContent=''};
  c.onpointermove=e=>{if(!st.cur)return;const p=pos(e),q=st.cur[st.cur.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])<3)return;x.beginPath();x.moveTo(q[0],q[1]);x.lineTo(p[0],p[1]);x.stroke();st.cur.push(p)};
  c.onpointerup=c.onpointercancel=()=>{st.cur=null}}
function lezSigCheck(strokes){let len=0,pts=0,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const s of strokes){pts+=s.length;for(let i=0;i<s.length;i++){const[a,b]=s[i];minx=Math.min(minx,a);maxx=Math.max(maxx,a);miny=Math.min(miny,b);maxy=Math.max(maxy,b);if(i)len+=Math.hypot(a-s[i-1][0],b-s[i-1][1])}}
  let turns=0;for(const s of strokes)for(let i=2;i<s.length;i++)for(const k of [0,1]){const d1=s[i-1][k]-s[i-2][k],d2=s[i][k]-s[i-1][k];if(d1*d2<0)turns++}
  return pts>=25&&len>=380&&(maxx-minx)>=150&&(maxy-miny)>=35&&turns>=3}
function lezSigStr(strokes){return strokes.filter(s=>s.length>1).map(s=>s.filter((p,i)=>i%2===0||i===s.length-1).map(p=>Math.round(p[0]/2)+' '+Math.round(p[1]/2)).join(',')).join('|')}
async function lezCollect(names,tr,label){const sigs=[];

    if(!ok)return null;sigs.push(ok)}

H['lz-start']=async el=>{if(!live){openDlg('<h3>⚠️ Sessione non connessa</h3><p>Le firme non si salvano se non sei collegato a claude.ai.</p><p><b>Dalla reception:</b> apri il link in una finestra normale, non in incognito. <b>Dal telefono:</b> assicurati di essere loggato su claude.ai.</p><div class="actions"><button class="btn" data-action="dlg-cancel">Ho capito</button></div>');return}const pk=Object.assign({_id:el.dataset.id},ptpk[el.dataset.id]);if(!pk.tr)return;

/* ---------- start ---------- */
readHash();render();
(async()=>{let d=null;
  /* --- Supabase adapter: stessa interfaccia di claude artifact db --- */
  function supaDB(){
    const API='/api/turni-db';
    const cache=new Map(),subs=new Map(),colSubs=new Map();
    const snap=(path,v)=>({id:path.split('/').pop(),exists:v!==undefined&&v!==null,data:()=>v});
    const notifyDoc=path=>{const fns=subs.get(path);if(fns)fns.forEach(fn=>fn(snap(path,cache.get(path))))};
    const notifyCol=col=>{const fns=colSubs.get(col);if(fns){const n=col.split('/').length+1;const ds=[];cache.forEach((v,k)=>{if(k.startsWith(col+'/')&&k.split('/').length===n)ds.push(snap(k,v))});fns.forEach(fn=>fn({docs:ds}))}};
    const notifyAll=()=>{subs.forEach((fns,path)=>notifyDoc(path));colSubs.forEach((fns,col)=>notifyCol(col))};
    // Initial load
    fetch(API+'?collection=').then(r=>r.json()).then(res=>{
      (res.docs||[]).forEach(d=>{cache.set(d.path,d.data)});notifyAll();
    }).catch(()=>{});
    // Poll every 15s
    setInterval(()=>{fetch(API+'?collection=').then(r=>r.json()).then(res=>{
      const newPaths=new Set();(res.docs||[]).forEach(d=>{newPaths.add(d.path);const old=cache.get(d.path);if(JSON.stringify(old)!==JSON.stringify(d.data)){cache.set(d.path,d.data);notifyDoc(d.path)}});
      cache.forEach((v,k)=>{if(!newPaths.has(k)){cache.delete(k);notifyDoc(k)}});
      colSubs.forEach((fns,col)=>notifyCol(col));
    }).catch(()=>{})},15000);
    return{
      doc(path){return{path,
        async set(data){cache.set(path,JSON.parse(JSON.stringify(data)));notifyDoc(path);
          const colPath=path.split('/').slice(0,-1).join('/');notifyCol(colPath);
          await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,data})}).catch(()=>{})},
        async delete(){cache.delete(path);notifyDoc(path);
          const colPath=path.split('/').slice(0,-1).join('/');notifyCol(colPath);
          await fetch(API,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})}).catch(()=>{})},
        onSnapshot(fn,errFn){if(!subs.has(path))subs.set(path,[]);subs.get(path).push(fn);fn(snap(path,cache.get(path)));return()=>{const a=subs.get(path);if(a){const i=a.indexOf(fn);if(i>=0)a.splice(i,1)}}}}},
      collection(col){const n=col.split('/').length+1;return{onSnapshot(fn,errFn){if(!colSubs.has(col))colSubs.set(col,[]);colSubs.get(col).push(fn);
        const ds=[];cache.forEach((v,k)=>{if(k.startsWith(col+'/')&&k.split('/').length===n)ds.push(snap(k,v))});fn({docs:ds});
        return()=>{const a=colSubs.get(col);if(a){const i=a.indexOf(fn);if(i>=0)a.splice(i,1)}}}}}}
  }
  /* --- Fine adapter --- */
  try{if(window.claude&&typeof window.claude.use==='function')d=await window.claude.use('db')}catch(e){d=null}
  if(d){db=d;live=true}else{db=supaDB();live=true}
  subscribe();
  (async()=>{try{const u=window.claude&&await window.claude.use('user');if(u){owner=!!(await u.isOwner());render();
    let info=null;try{info=await u.me()}catch(e){}const id=info&&info.id||await u.id();diag.id=id||null;const em=(info&&info.email||'').toLowerCase();diag.email=em?em.replace(/^(.).*(@.*)$/,'$1…$2'):null;
    if(em&&!SHARED){const st=cfg.staff.find(p=>(p.email||'').toLowerCase()===em);if(st){autoMe=st.id}}
    if(id&&live){prefsOn=true;prefsPath='uacct/'+String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,190);let first=true;db.doc(prefsPath).onSnapshot(sn=>{diag.prefsRead=sn.exists?'trovate':'vuote';if(sn.exists){serverPrefs=sn.data();diag.prefsMe=serverPrefs.me||'';if(!prefsApplied){prefsApplied=true;applyPrefs(serverPrefs)}}else if(!prefsApplied&&first){first=false;setTimeout(()=>{if(!prefsApplied){prefsApplied=true;applyPrefs(null)}},2500)}},e=>{diag.prefsRead='errore '+(e&&e.code||'');prefsLoaded=false})}else{prefsLoaded=false;diag.prefsRead='non disponibili'}
    applyStaffView();render()}}catch(e){}})();
  setTimeout(()=>{if(!ready){ready=true;render()}},4000);

/* Contatore d'uso silenzioso: registra cosa viene toccato (non mostra nulla) */
let useBuf={},useSeen=new Set();
function useKey(){const m=new Date();return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}_${(ui.me==='dir'?'ceo':ui.me)||'anonimo'}`}
function useHit(k){if(!k)return;k=String(k).replace(/[^\w\-:|àèéìòù ]/g,'').trim().slice(0,60);if(!k)return;const id=useKey();(useBuf[id]=useBuf[id]||{})[k]=((useBuf[id]||{})[k]||0)+1}
function useFlush(){try{if(!live||readOnly)return;for(const id of Object.keys(useBuf)){const add=useBuf[id];delete useBuf[id];const U=window.__usage||(window.__usage={});const cur=Object.assign({},(U[id]||{}).c||{});for(const k in add)cur[k]=(cur[k]||0)+add[k];const doc={c:cur,who:id.split('_').slice(1).join('_'),month:id.split('_')[0],at:Date.now()};U[id]=doc;write('usage/'+id,doc)}}catch(e){}}
document.addEventListener('click',e=>{try{const el=e.target.closest('[data-action],summary');if(!el)return;const tab=ui.tab||'';
  if(el.tagName==='SUMMARY'&&!el.dataset.action){useHit(tab+'|apre: '+el.textContent);return}
  const a=el.dataset.action;useHit(a==='tab'?'scheda: '+el.dataset.tab:tab+'|'+a)}catch(err){}},true);
const useObs=new IntersectionObserver(es=>{for(const en of es)if(en.isIntersecting&&ui.tab==='gestione'){const t=(ui.tab||'')+'|vede: '+en.target.textContent;const sk=new Date().toDateString()+t;if(!useSeen.has(sk)){useSeen.add(sk);useHit(t)}}},{threshold:1});
setInterval(()=>{try{document.querySelectorAll('main h2, main h3').forEach(h=>{if(!h.__uo){h.__uo=1;useObs.observe(h)}})}catch(e){}},2000);
setInterval(useFlush,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')useFlush()});
  setInterval(()=>{if(!dlg.open)render()},60000);
})();
})();
